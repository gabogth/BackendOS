<section class="card shadow-sm border-0">
  <header class="card-header border-bottom">
    <h5 class="mb-0">Mantenimiento de Módulos</h5>
  </header>

  <div class="card-body">
    <dx-data-grid
      [dataSource]="modulosDataSource"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [showRowLines]="true"
      [rowAlternationEnabled]="true"
      [selection]="{ mode: 'single' }"
      [remoteOperations]="true">
      <dxo-search-panel [visible]="true"></dxo-search-panel>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-data-grid-header-filter [visible]="true"></dxo-data-grid-header-filter>
      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]" [showInfo]="true"></dxo-pager>
      <dxo-editing mode="popup" [allowAdding]="true" [allowUpdating]="true" [allowDeleting]="true" [useIcons]="true">
        <dxo-popup title="Módulo" [showTitle]="true"></dxo-popup>
      </dxo-editing>

      <dxi-column dataField="id" [visible]="false" [allowEditing]="false"></dxi-column>
      <dxi-column dataField="nombre" caption="Nombre" [validationRules]="[{ type: 'required' }]" ></dxi-column>
      <dxi-column dataField="nombreCorto" caption="Nombre Corto" [validationRules]="[{ type: 'required' }]" ></dxi-column>
      <dxi-column dataField="descripcion" caption="Descripción"></dxi-column>
      <dxi-column dataField="rutaImagen" caption="Ruta Imagen"></dxi-column>
      <dxi-column dataField="controlador" caption="Controlador"></dxi-column>
      <dxi-column dataField="action" caption="Action"></dxi-column>
      <dxi-column dataField="estado" caption="Activo" dataType="boolean"></dxi-column>
    </dx-data-grid>
  </div>
</section>
